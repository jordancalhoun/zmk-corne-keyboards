manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: jordancalhoun
      url-base: https://github.com/jordancalhoun
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Prospector dongle display; hard fork of carrefinho/prospector-zmk-module
    # (feat/new-status-screens merged into main, targets ZMK main / Zephyr 4.1)
    - name: prospector-zmk-module
      remote: jordancalhoun
      revision: main
  self:
    path: config
