# Prospector dongle (central)

# no APDS9960 installed, use a fixed backlight level instead
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50

# screen sleep: after this many ms with no keypresses, ZMK blanks the display
# and src/backlight_idle.c fades the backlight to the idle level
CONFIG_ZMK_IDLE_TIMEOUT=900000
# CONFIG_CORNE_DONGLE_BACKLIGHT_IDLE_BRIGHTNESS=0
# CONFIG_CORNE_DONGLE_BACKLIGHT_FADE_MS=500

# status screen layout, classic is the default
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y

# uncomment if the build fails with "region 'RAM' overflowed"
# CONFIG_LV_Z_VDB_SIZE=25
