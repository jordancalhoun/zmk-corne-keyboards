CONFIG_ZMK_KEYBOARD_NAME="Alpine"

# Enable battery proxy so that we can get the battery info
# of the right half via computer
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- Core sleep behavior ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# --- nice!view displays ---
# nice-view-gem custom status screen (https://github.com/M165437/nice-view-gem)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
